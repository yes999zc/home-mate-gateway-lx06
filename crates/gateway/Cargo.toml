[package]
name = "home-mate-device-gateway"
description = "Home Mate Device Gateway — external device access component"
edition.workspace = true
version.workspace = true
license-file.workspace = true

[dependencies]
# Registered in docs/HANDOFF.md §5 before addition (AGENTS rule).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
base64 = "0.22"
# Direct-occupation firmware (G5-2): raw /dev/snd + evdev + ifreq ioctls.
libc = "0.2"

[build-dependencies]
cc = "1"
